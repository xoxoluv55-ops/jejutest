<html><body style="margin:0;background:#000"><script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script><script src="common.js"></script><script>
const W=1600,H=500,R=new THREE.WebGLRenderer({antialias:true});R.setSize(W,H);R.setPixelRatio(1);document.body.appendChild(R.domElement);R.autoClear=false;
function baseScene(){const S=new THREE.Scene();S.background=new THREE.Color(0x120B33);S.fog=new THREE.Fog(0x120B33,90,520);
 S.add(new THREE.HemisphereLight(0x8877ff,0x110822,0.9));const d=new THREE.DirectionalLight(0xb9a8ff,0.7);d.position.set(2,4,-3);S.add(d);
 // road: dark ribbon with neon edges (gold = myelin zone colour)
 const road=new THREE.Mesh(new THREE.PlaneGeometry(12,400),new THREE.MeshStandardMaterial({color:0x120e36,emissive:0x0d0a26}));road.rotation.x=-Math.PI/2;road.position.z=190;S.add(road);
 for(const x of[-6,6]){const e=new THREE.Mesh(new THREE.BoxGeometry(0.12,0.55,400),new THREE.MeshBasicMaterial({color:0xFFB627}));e.position.set(x,.27,190);S.add(e);}
 for(let z=0;z<400;z+=8){const m=new THREE.Mesh(new THREE.BoxGeometry(0.08,0.01,3),new THREE.MeshBasicMaterial({color:0x9a7020}));m.position.set(0,.02,z);S.add(m);}
 return S;}
const nodes=[];for(let z=26;z<400;z+=55)nodes.push(z);
const ringX=k=>3.2*Math.sin(k*0.9);
function nodeRing(S,z,x,glow){const t=new THREE.Mesh(new THREE.TorusGeometry(2.6,.14,8,36),new THREE.MeshBasicMaterial({color:0x37f0e8}));t.position.set(x,1.1,z);S.add(t);
 if(glow){const q=new THREE.Mesh(new THREE.PlaneGeometry(6.8,6.8),addMat(0x66ffff,.45));q.position.set(x,1.1,z);S.add(q);}}
// ---------------- 1.0 ----------------
const S1=baseScene();
for(let z=10;z<400;z+=6){if(nodes.some(n=>Math.abs(n-z)<7))continue;const h=new THREE.Mesh(new THREE.TorusGeometry(7.2,.22,5,28),new THREE.MeshBasicMaterial({color:0xE0A020}));h.position.set(0,2.6,z);S1.add(h);}
nodes.forEach((z,k)=>nodeRing(S1,z,ringX(k),false));
const st1=starV1('Normal');st1.position.set(0,1.1,16);st1.rotation.y=0;S1.add(st1);
// ---------------- 2.0 ----------------
const S2=baseScene();
function lamTex(){const c=document.createElement('canvas');c.width=128;c.height=64;const x=c.getContext('2d');const img=x.createImageData(128,64);
 for(let y=0;y<64;y++)for(let i=0;i<128;i++){const u=i/128,v=y/64;const sp=((u*6+v)%1+1)%1;const l=Math.exp(-Math.pow((sp-.5)/.05,2));const g=0.82+0.18*Math.random()*0.5;const o=(y*128+i)*4;
 img.data[o]=Math.min(255,(0.96*g+l*.6)*255*0.5);img.data[o+1]=Math.min(255,(0.8*g+l*.58)*255*0.5);img.data[o+2]=Math.min(255,(0.45*g+l*.45)*255*0.5);img.data[o+3]=255;}
 x.putImageData(img,0,0);const t=new THREE.CanvasTexture(c);t.wrapS=t.wrapT=THREE.RepeatWrapping;return t;}
const LT=lamTex();
function tube(z0,z1,rad,inner){const N=36,rings=Math.ceil((z1-z0)/2)+1,v=[],uv=[],idx=[];
 for(let i=0;i<rings;i++){const z=z0+(z1-z0)*i/(rings-1),d=Math.min(z-z0,z1-z),k=0.82+0.18*Math.min(1,Math.max(0,d/5))**2*(3-2*Math.min(1,Math.max(0,d/5)));
  for(let j=0;j<=N;j++){const a=j/N*Math.PI*2;const r=inner?rad*k:rad*k+0.5;v.push(Math.cos(a)*r,2.4+Math.sin(a)*r,z);uv.push(j/N*3,(z-z0)/7);}}
 for(let i=0;i<rings-1;i++)for(let j=0;j<36;j++){const a=i*37+j,b=a+1,c=a+37,e=c+1;idx.push(a,c,b,b,c,e);}
 const g=new THREE.BufferGeometry();g.setAttribute('position',new THREE.Float32BufferAttribute(v,3));g.setAttribute('uv',new THREE.Float32BufferAttribute(uv,2));g.setIndex(idx);g.computeVertexNormals();
 return new THREE.Mesh(g,new THREE.MeshBasicMaterial({map:LT,color:inner?0xd8b070:0xffd080,side:THREE.DoubleSide}));}
let a=4;for(const n of nodes.concat([420])){const b=n-4.5;if(b-a>6){S2.add(tube(a,b,8.2,true));for(const e of[a,b]){const p=new THREE.Mesh(new THREE.TorusGeometry(6.97,.32,6,40),new THREE.MeshBasicMaterial({color:0xFFC23D}));p.position.set(0,2.4,e);S2.add(p);}}a=n+4.5;}
nodes.forEach((z,k)=>{const band=new THREE.Mesh(new THREE.CylinderGeometry(7.4,7.4,9,36,1,true),new THREE.MeshBasicMaterial({color:k==1?0x1f8a9a:0x0f4d58,side:THREE.DoubleSide}));band.rotation.x=Math.PI/2;band.position.set(0,2.4,z);S2.add(band);
 for(let r=0;r<2;r++)for(let i=0;i<22;i++){const an=(i+r*.5)/22*Math.PI*2;const s=new THREE.Mesh(new THREE.CylinderGeometry(.19,.19,.32,8),new THREE.MeshBasicMaterial({color:k==0?0xffffff:0x3fe0e8}));const dir=new THREE.Vector3(Math.cos(an),Math.sin(an),0);s.position.set(dir.x*7.15,2.4+dir.y*7.15,z+(r-.5)*3.2);s.quaternion.setFromUnitVectors(new THREE.Vector3(0,1,0),dir);S2.add(s);}
 nodeRing(S2,z,ringX(k),true);});
// pulse racing ahead + Na+ influx at node 0 (just hit)
const pulse=new THREE.Mesh(new THREE.TorusGeometry(7.05,.22,6,48),addMat(0x99ffff,1));pulse.position.set(0,2.4,60);S2.add(pulse);
for(let i=0;i<40;i++){const an=Math.random()*Math.PI*2,r=4+Math.random()*3;const p=new THREE.Mesh(new THREE.PlaneGeometry(.35,.35),addMat(0x9ffcff,.9));p.position.set(Math.cos(an)*r,2.4+Math.sin(an)*r,26+(Math.random()-.5)*6);S2.add(p);}
const st2=starV2('Normal');st2.position.set(0,1.1,16);st2.rotation.y=0;S2.add(st2);
const sh=new THREE.Mesh(new THREE.CircleGeometry(1.3,24),new THREE.MeshBasicMaterial({color:0x05000f,transparent:true,opacity:.55}));sh.rotation.x=-Math.PI/2;sh.position.set(0,.06,16);S2.add(sh);
// cameras: 1.0 chase (7.5 back, 3.2 up) vs 2.0 chase (6.4 back, 2.6 up)
const C1=new THREE.PerspectiveCamera(66,800/500,.3,560);C1.position.set(0,1.1+3.2,16-7.5);C1.lookAt(0,1.1+1.1,16+9);
const C2=new THREE.PerspectiveCamera(66,800/500,.3,560);C2.position.set(0,1.1+2.6,16-6.4);C2.lookAt(0,1.1+1.0,16+8.5);
R.setScissorTest(true);R.setViewport(0,0,800,500);R.setScissor(0,0,800,500);R.render(S1,C1);R.setViewport(800,0,800,500);R.setScissor(800,0,800,500);R.render(S2,C2);
</script></body></html>
