<!doctype html>
<html><head><meta charset="utf-8">
<script type="importmap">{ "imports": { "three": "./node_modules/three/build/three.module.js" } }</script>
</head><body style="margin:0;background:#000">
<script type="module">
import * as THREE from 'three';

// --- shared GLSL: 3D simplex noise (Ashima / Stefan Gustavson, MIT) ---
const NOISE = `
vec3 mod289(vec3 x){return x-floor(x*(1.0/289.0))*289.0;}
vec4 mod289(vec4 x){return x-floor(x*(1.0/289.0))*289.0;}
vec4 permute(vec4 x){return mod289(((x*34.0)+1.0)*x);}
vec4 taylorInvSqrt(vec4 r){return 1.79284291400159-0.85373472095314*r;}
float snoise(vec3 v){
  const vec2 C=vec2(1.0/6.0,1.0/3.0); const vec4 D=vec4(0.0,0.5,1.0,2.0);
  vec3 i=floor(v+dot(v,C.yyy)); vec3 x0=v-i+dot(i,C.xxx);
  vec3 g=step(x0.yzx,x0.xyz); vec3 l=1.0-g; vec3 i1=min(g.xyz,l.zxy); vec3 i2=max(g.xyz,l.zxy);
  vec3 x1=x0-i1+C.xxx; vec3 x2=x0-i2+C.yyy; vec3 x3=x0-D.yyy;
  i=mod289(i);
  vec4 p=permute(permute(permute(i.z+vec4(0.0,i1.z,i2.z,1.0))+i.y+vec4(0.0,i1.y,i2.y,1.0))+i.x+vec4(0.0,i1.x,i2.x,1.0));
  float n_=0.142857142857; vec3 ns=n_*D.wyz-D.xzx;
  vec4 j=p-49.0*floor(p*ns.z*ns.z); vec4 x_=floor(j*ns.z); vec4 y_=floor(j-7.0*x_);
  vec4 x=x_*ns.x+ns.yyyy; vec4 y=y_*ns.x+ns.yyyy; vec4 h=1.0-abs(x)-abs(y);
  vec4 b0=vec4(x.xy,y.xy); vec4 b1=vec4(x.zw,y.zw);
  vec4 s0=floor(b0)*2.0+1.0; vec4 s1=floor(b1)*2.0+1.0; vec4 sh=-step(h,vec4(0.0));
  vec4 a0=b0.xzyw+s0.xzyw*sh.xxyy; vec4 a1=b1.xzyw+s1.xzyw*sh.zzww;
  vec3 p0=vec3(a0.xy,h.x); vec3 p1=vec3(a0.zw,h.y); vec3 p2=vec3(a1.xy,h.z); vec3 p3=vec3(a1.zw,h.w);
  vec4 norm=taylorInvSqrt(vec4(dot(p0,p0),dot(p1,p1),dot(p2,p2),dot(p3,p3)));
  p0*=norm.x; p1*=norm.y; p2*=norm.z; p3*=norm.w;
  vec4 m=max(0.6-vec4(dot(x0,x0),dot(x1,x1),dot(x2,x2),dot(x3,x3)),0.0); m=m*m;
  return 42.0*dot(m*m,vec4(dot(p0,x0),dot(p1,x1),dot(p2,x2),dot(p3,x3)));
}`;

const VS = `
attribute vec3 fib; attribute float ten;
varying vec3 vN; varying vec3 vP; varying vec3 vF; varying float vT;
void main(){
  vN = normalize(normal); vP = position; vF = fib; vT = ten;
  gl_Position = projectionMatrix * modelViewMatrix * vec4(position,1.0);
}`;

const FS = NOISE + `
uniform int mode;            // 0 color, 1 flat id, 2 screen-space fibre direction
uniform int kind;            // 0 muscle, 1 bone, 2 context muscle
uniform vec3 idColor; uniform vec3 base; uniform vec3 tcol; uniform float fiberFreq;
varying vec3 vN; varying vec3 vP; varying vec3 vF; varying float vT;
void main(){
  if (mode == 1) { gl_FragColor = vec4(idColor, 1.0); return; }
  vec3 n = normalize(vN); if (!gl_FrontFacing) n = -n;
  if (mode == 2) {
    vec3 f = normalize(vF); vec3 ft = f - n * dot(n, f);
    vec2 d = ft.xy; float l = length(d); d = l > 1e-4 ? d / l : vec2(0.0, 1.0);
    gl_FragColor = vec4(d * 0.5 + 0.5, vT, 1.0); return;
  }
  vec3 L = normalize(vec3(-0.55, 0.62, 0.56));      // upper-left-front key (y up in render space)
  vec3 L2 = normalize(vec3(0.7, -0.2, 0.5));        // cool fill from lower right
  float d = max(dot(n, L), 0.0); float d2 = max(dot(n, L2), 0.0);
  float wrap = clamp((dot(n, L) + 0.35) / 1.35, 0.0, 1.0);
  vec3 H = normalize(L + vec3(0.0, 0.0, 1.0)); float sp = pow(max(dot(n, H), 0.0), 28.0);
  float rim = pow(1.0 - clamp(n.z, 0.0, 1.0), 2.2);
  vec3 col;
  if (kind == 1) {
    float g = snoise(vP * 0.09) * 0.5 + snoise(vP * 0.31) * 0.25;
    col = base * (0.98 + 0.05 * g);
    col = col * (0.42 + 0.62 * wrap) + vec3(0.10, 0.11, 0.14) * d2 + vec3(1.0) * sp * 0.18;
    col *= 1.0 - rim * 0.45;
  } else {
    float s3 = snoise(vP * 0.03);
    vec3 mus = base * (0.92 + 0.06 * s3);
    // tendon / aponeurosis: glossy, faint parallel collagen streaks
    vec3 tdn = tcol;
    float t = smoothstep(0.35, 0.75, vT);
    col = mix(mus, tdn, t);
    float spec = sp * mix(0.22, 0.55, t);
    col = col * (0.36 + 0.70 * wrap) + vec3(0.06, 0.07, 0.10) * d2 + vec3(1.0, 0.95, 0.92) * spec;
    col *= 1.0 - rim * 0.55;
  }
  gl_FragColor = vec4(pow(col, vec3(1.0/1.05)), 1.0);
}`;

function b64(s, T) { const bin = atob(s); const u = new Uint8Array(bin.length); for (let i = 0; i < bin.length; i++) u[i] = bin.charCodeAt(i); return new T(u.buffer); }

let renderer;
window.renderJobs = async (scene, jobs) => {
  if (!scene.__g) { scene.__g = {};
  for (const m of scene.meshes) {
    const g = new THREE.BufferGeometry();
    g.setAttribute('position', new THREE.BufferAttribute(b64(m.pos, Float32Array), 3));
    g.setAttribute('fib', new THREE.BufferAttribute(b64(m.fib, Float32Array), 3));
    g.setAttribute('ten', new THREE.BufferAttribute(b64(m.ten, Float32Array), 1));
    g.setIndex(new THREE.BufferAttribute(b64(m.idx, Uint32Array), 1));
    g.computeVertexNormals();
    scene.__g[m.name] = { g, kind: m.kind, base: m.base, tcol: m.tcol || [0.93, 0.89, 0.80] };
  } }
  const geoms = scene.__g;
  const out = {};
  for (const job of jobs) {
    const [W, H] = job.size;
    if (!renderer) { renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true, preserveDrawingBuffer: true }); document.body.appendChild(renderer.domElement); }
    renderer.setPixelRatio(1); renderer.setSize(W, H, false);
    renderer.setClearColor(0x000000, 0);
    const sc = new THREE.Scene();
    const [x0, y0, x1, y1] = job.view;     // frame coords (y down)
    const cam = new THREE.OrthographicCamera(x0, x1, -y0, -y1, -5000, 5000);
    cam.position.set(0, 0, 2000); cam.lookAt(0, 0, 0);
    let k = 0;
    for (const name of job.meshes) {
      const G = geoms[name]; k++;
      const idc = job.ids && job.ids[name] ? job.ids[name] : [0, 0, 0];
      const mat = new THREE.ShaderMaterial({
        vertexShader: VS, fragmentShader: FS, side: THREE.DoubleSide,
        uniforms: {
          mode: { value: job.mode === 'id' ? 1 : job.mode === 'dir' ? 2 : 0 }, kind: { value: G.kind },
          idColor: { value: new THREE.Vector3(...idc.map(v => v / 255)) },
          base: { value: new THREE.Vector3(...G.base) }, tcol: { value: new THREE.Vector3(...G.tcol) },
          fiberFreq: { value: job.fiberFreq || 0.55 },
        },
      });
      // depth-only occluders: rendered into the depth buffer but invisible
      if (job.occluders && job.occluders.includes(name)) { mat.colorWrite = false; }
      const mesh = new THREE.Mesh(G.g, mat);
      if (job.occluders && job.occluders.includes(name)) mesh.renderOrder = -1;
      sc.add(mesh);
    }
    renderer.render(sc, cam);
    out[job.name] = renderer.domElement.toDataURL('image/png');
  }
  return out;
};
window.ready = true;
</script></body></html>
