// Every job renders one transparent layer (a background, or a single movable part) at an exact logical size.
// Units: 1 world unit = 1 logical px of the game texture (textures are saved at density 2).

const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true, preserveDrawingBuffer: true });

// ------------------------------------------------------------------ procedural textures (seeded)
function rng(seed) { let s = seed >>> 0 || 1; return () => ((s = (s * 1664525 + 1013904223) >>> 0) / 4294967296); }

}

// ------------------------------------------------------------------ geometry helpers
const box = (w, h, d, m, r = 2) => { const g = r > 0 ? new RoundedBoxGeometry(w, h, d, 3, Math.min(r, w / 2 - 0.01, h / 2 - 0.01, d / 2 - 0.01)) : new THREE.BoxGeometry(w, h, d); const o = new THREE.Mesh(g, m); o.castShadow = o.receiveShadow = true; return o; };
const cyl = (r0, r1, h, m, seg = 48) => { const o = new THREE.Mesh(new THREE.CylinderGeometry(r0, r1, h, seg), m); o.castShadow = o.receiveShadow = true; return o; };
const at = (o, x, y, z) => { o.position.set(x, y, z); return o; };
function labelTex(w, h, draw) { const [c, x] = canvas(w, h); draw(x, w, h); return tex(c); }
function textPlane(w, h, draw, opts = {}) { const m = new THREE.MeshStandardMaterial({ map: labelTex(w * 4, h * 4, (x, W, H) => { x.scale(4, 4); draw(x, w, h); }), transparent: true, roughness: opts.rough ?? 0.8, metalness: opts.metal ?? 0, envMapIntensity: 0.5 }); const o = new THREE.Mesh(new THREE.PlaneGeometry(w, h), m); o.receiveShadow = true; return o; }

// ------------------------------------------------------------------ stage: ortho camera with a pitch; screen <-> world
function stage(w, h, pitchDeg, light = {}) {

  key.shadow.mapSize.set(2048, 2048); const sc = key.shadow.camera; sc.left = -w; sc.right = w; sc.top = h * 1.4; sc.bottom = -h * 1.4; sc.near = 1; sc.far = 6000; key.shadow.bias = -0.0004; key.shadow.radius = 6;

      const dir = new THREE.Vector3(); cam.getWorldDirection(dir);

    },
    toScreen(v) { const p = v.clone().project(cam); return [(p.x + 1) / 2 * w, (1 - p.y) / 2 * h]; },

}

// ------------------------------------------------------------------ builders
const B = {};
const Y = new THREE.Plane(new THREE.Vector3(0, 1, 0), 0);
const planeZ = z => new THREE.Plane(new THREE.Vector3(0, 0, 1), -z);
const planeY = y => new THREE.Plane(new THREE.Vector3(0, 1, 0), -y);
/** a horizontal slab whose top face covers a screen rectangle (ortho, pitched camera) */
function topRect(S, x0, y0, x1, y1, yTop) { const a = S.onPlane(x0, y0, planeY(yTop)), b = S.onPlane(x1, y1, planeY(yTop)); return { cx: (a.x + b.x) / 2, cz: (a.z + b.z) / 2, w: Math.abs(b.x - a.x), d: Math.abs(b.z - a.z) }; }

// desk / bench background: wall, worktop (screen y 110..380), front (380..560) with drawers
function workDesk(S, o) {
  const s = S.scene;
  const top = topRect(S, 10, 110, 990, 380, 0);
  const zF = top.cz + top.d / 2, zB = top.cz - top.d / 2;

  s.add(at(box(2400, 30, 10, T.steelDark, 2), 0, -20, zB - 24));

B.inv_desk = () => {
  const S = stage(1000, 560, 42, { kx: -500, ky: 1500, kz: 700, key: 2.0 });
  const d = workDesk(S, { top: T.wood, body: T.wood, drawer: T.woodLight, handle: T.brass, drawers: [[300, 398, 700, 538, 500, 120, 460], [40, 398, 280, 538, 160, 50, 460], [720, 398, 960, 538, 840, 50, 460]] });

  lamp.add(at(cyl(30, 34, 10, T.steelDark), 0, 5, 0));

  arm(0, 8, -40, 150); arm(-40, 150, -120, 200);
  const shade = new THREE.Mesh(new THREE.ConeGeometry(42, 60, 40, 1, true), new THREE.MeshStandardMaterial({ color: 0x2e5a4a, metalness: 0.5, roughness: 0.4, side: THREE.DoubleSide }));
  shade.position.set(-140, 180, 0); shade.rotation.z = 0.9; shade.castShadow = true; lamp.add(shade);
  const bulb = new THREE.PointLight(0xffc98a, 900000, 0, 2); bulb.position.set(-140, 160, 10); lamp.add(bulb);
  // pen cup + a paper stack, away from the interactive items

  for (const [dx, dz, a] of [[-6, 0, 0.3], [4, -4, -0.2], [0, 6, 0.1]]) { const pen = cyl(2.5, 2.5, 90, a > 0 ? T.redPaint : T.black, 12); pen.position.set(pc.x + dx, 80, pc.z + dz); pen.rotation.z = a; S.scene.add(pen); }

};

B.inv_note = () => {
  const S = stage(170, 130, 90);
  const geo = new THREE.PlaneGeometry(158, 118, 20, 20); const p = geo.attributes.position;
