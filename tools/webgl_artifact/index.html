<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <!-- iPad Safari: full screen, no pinch / double-tap zoom, respect the notch safe area -->
  <meta name="viewport" content="width=device-width, height=device-height, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="theme-color" content="#0a0618">
  <title>MUSCLE BATTLE</title>
  <style>
    html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #0a0618;
      touch-action: none; -webkit-user-select: none; user-select: none; -webkit-touch-callout: none;
      -webkit-tap-highlight-color: transparent; overscroll-behavior: none; }
    #unity-canvas { position: fixed; inset: 0; width: 100vw; height: 100vh; height: 100dvh; display: block; background: #0a0618; outline: none; }
    #loader { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center;
      background: radial-gradient(circle at 50% 40%, #2a0b4a 0%, #0a0618 70%); color: #fff;
      font-family: -apple-system, "Apple SD Gothic Neo", "Malgun Gothic", sans-serif; transition: opacity .4s; }
    #loader h1 { margin: 0; font-size: clamp(36px, 8vw, 96px); font-style: italic; letter-spacing: 2px;
      text-shadow: 0 0 24px #ff3a28, 0 4px 0 #3a0010; }
    #loader p { margin: 8px 0 28px; color: #9fd8ff; letter-spacing: 6px; font-size: clamp(11px, 1.6vw, 18px); }
    #bar { width: min(60vw, 640px); height: 14px; border: 2px solid #a070ff; transform: skewX(-20deg); background: #12062a; }
    #fill { height: 100%; width: 0%; background: linear-gradient(90deg, #33d9ff, #a855ff, #ff4d6d); box-shadow: 0 0 18px #a855ff; }
    #hint { margin-top: 18px; color: #c9c3ff; font-size: 14px; }
    #error { display: none; position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%); max-width: 90vw;
      background: #3a0010; color: #fff; padding: 10px 16px; border: 1px solid #ff4d6d; font-family: sans-serif; }
  </style>
</head>
<body>
  <canvas id="unity-canvas" tabindex="-1"></canvas>
  <div id="loader">
    <h1>MUSCLE BATTLE</h1>
    <p>ARCADE FIGHTING GAME</p>
    <div id="bar"><div id="fill"></div></div>
    <div id="hint">가로 모드로 플레이하세요 · Landscape recommended</div>
  </div>
  <div id="error"></div>
  <script>
    var canvas = document.querySelector("#unity-canvas");
    var isTouch = ("ontouchstart" in window) || navigator.maxTouchPoints > 1;

    // block page scroll / bounce / zoom gestures so touches always reach the game
    ["touchmove", "gesturestart", "gesturechange", "dblclick"].forEach(function (ev) {
      document.addEventListener(ev, function (e) { e.preventDefault(); }, { passive: false });
    });

    function showError(msg) {
      var e = document.querySelector("#error");
      e.textContent = msg;
      e.style.display = "block";
    }

    var buildUrl = "Build";
    var loaderUrl = buildUrl + "/WebGL.loader.js";
    // Game files are shipped as base64 text parts (the host only serves text and a few media types):
    // download → decode → gunzip in the browser → hand Unity blob: URLs.
    var PARTS = { code: 2, data: 3 };
    var setFill = function (p) { document.querySelector("#fill").style.width = Math.round(p * 100) + "%"; };
    function b64ToBytes(s) {
      var bin = atob(s), out = new Uint8Array(bin.length);
      for (var i = 0; i < bin.length; i++) out[i] = bin.charCodeAt(i);
      return out;
    }
    async function loadPacked(name, n, done, total) {
      var chunks = [];
      for (var i = 0; i < n; i++) {
        var r = await fetch(buildUrl + "/" + name + "_" + i + ".txt");
        if (!r.ok) throw new Error(name + " part " + i + " HTTP " + r.status);
        chunks.push(b64ToBytes(await r.text()));
        done.n++; setFill(0.5 * done.n / total);
      }
      var gz = new Blob(chunks);
      if (typeof DecompressionStream === "undefined") throw new Error("이 브라우저는 압축 해제를 지원하지 않아요 (iPadOS 16.4 이상 필요)");
      return await new Response(gz.stream().pipeThrough(new DecompressionStream("gzip"))).blob();
    }
    var config = {
      dataUrl: "",
      frameworkUrl: buildUrl + "/framework.js",
      codeUrl: "",
      streamingAssetsUrl: "StreamingAssets",
      companyName: "MuscleBattle",
      productName: "MUSCLE BATTLE",
      productVersion: "1.0",
      showBanner: function (msg, type) { if (type === "error") showError(msg); },
      // Retina iPads would otherwise render at 2732x2048: cap the pixel ratio for a stable frame rate
      devicePixelRatio: isTouch ? Math.min(window.devicePixelRatio || 1, 1.5) : (window.devicePixelRatio || 1)
    };
    async function boot() {
      var done = { n: 0 }, total = PARTS.code + PARTS.data;
      var code = await loadPacked("code", PARTS.code, done, total);
      var data = await loadPacked("data", PARTS.data, done, total);
      config.codeUrl = URL.createObjectURL(new Blob([code], { type: "application/wasm" }));
      config.dataUrl = URL.createObjectURL(data);
      config.cacheControl = function () { return "no-store"; };
      return createUnityInstance(canvas, config, function (progress) { setFill(0.5 + 0.5 * progress); });
    }
    var script = document.createElement("script");
    script.src = loaderUrl;
    script.onload = function () {
      boot().then(function (instance) {
        var loader = document.querySelector("#loader");
        loader.style.opacity = "0";
        setTimeout(function () { loader.style.display = "none"; }, 450);
        canvas.focus();
      }).catch(function (message) { showError(String(message && message.message || message)); });
    };
    document.body.appendChild(script);
  </script>
</body>
</html>
